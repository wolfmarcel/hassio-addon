name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      evcc_version:
        description: 'evcc version tag to build (e.g. 0.316.2)'
        required: true
        default: '0.316.2'

jobs:
  build:
    name: Build evcc + alfenhttp plugin
    runs-on: ubuntu-latest

    steps:
      - name: Clone evcc at specified version
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.evcc_version }} \
            https://github.com/evcc-io/evcc evcc

      - name: Clone alfenhttp plugin (private)
        run: |
          git clone --depth 1 \
            https://x-access-token:${{ secrets.ALFEN_REPO_TOKEN }}@github.com/berndkrannich/evcc-alfenhttp \
            evcc-alfenhttp

      - name: Apply plugin into evcc source tree
        run: |
          cp -R evcc-alfenhttp/src/* evcc/

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: evcc
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            wolfmarcel/evcc-alfen:${{ github.event.inputs.evcc_version }}
            wolfmarcel/evcc-alfen:latest
          build-args: |
            RELEASE=1
